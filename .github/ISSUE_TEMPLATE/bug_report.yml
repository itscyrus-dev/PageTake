name: Bug report
description: Report a reproducible PageTake problem
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: Use a public fixture and remove credentials, private URLs, and captured data from the report.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the PageTake, Node.js, and Chrome versions, plus your operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command and expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized output
      render: shell
