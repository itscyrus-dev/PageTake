name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Build release archive
        id: archive
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          archive="pagetake-$version.tar.gz"
          checksum="$archive.sha256"
          git archive --format=tar.gz --prefix="pagetake-$version/" -o "$archive" HEAD
          sha256sum "$archive" > "$checksum"
          echo "file=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.archive.outputs.file }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "PageTake $GITHUB_REF_NAME" "$ARCHIVE" "$CHECKSUM"
