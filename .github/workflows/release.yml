name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Build release archive
        id: archive
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor HEAD origin/main
          archive="pagetake-$version.tar.gz"
          checksum="$archive.sha256"
          git archive --format=tar.gz --prefix="pagetake-$version/" -o "$archive" HEAD
          sha256sum "$archive" > "$checksum"
          echo "file=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Generate release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
      - name: Publish to GitHub Releases
        env:
          ARCHIVE: ${{ steps.archive.outputs.file }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
        shell: bash
        run: |
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "Release $GITHUB_REF_NAME is already published."
              exit 0
            fi
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "PageTake $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          sha256sum -c "$CHECKSUM"
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$CHECKSUM" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
