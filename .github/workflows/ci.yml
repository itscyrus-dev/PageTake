name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Find Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          test -x "$chrome"
          "$chrome" --version
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
